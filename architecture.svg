<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 640" width="1290" height="640" role="img" aria-labelledby="title desc">
  <title id="title">SiteShield architecture</title>
  <desc id="desc">The website talks to the API server, the CLI runs directly. Both use the same scan engine, which scans the live site and the source code, matches the findings, and produces a grade with fixes.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;family=Roboto+Mono&amp;display=swap');
      text { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; fill: #202124; }
      .h1 { font-size: 26px; font-weight: 500; }
      .sub { font-size: 15px; fill: #5f6368; }
      .col { font-size: 12px; font-weight: 500; fill: #5f6368; letter-spacing: 1px; }
      .name { font-size: 16px; font-weight: 500; }
      .detail { font-size: 12.5px; fill: #5f6368; }
      .mono { font-family: 'Roboto Mono', Menlo, monospace; font-size: 11.5px; fill: #5f6368; }
      .num { font-size: 13px; font-weight: 500; fill: #ffffff; }
      .line { stroke: #80868b; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#80868b" />
    </marker>
  </defs>

  <rect width="1290" height="640" fill="#ffffff" />

  <!-- Title -->
  <text x="40" y="52" class="h1">SiteShield architecture</text>
  <text x="40" y="80" class="sub">Two ways in, one scan engine, one report.</text>

  <!-- Column labels -->
  <text x="40" y="128" class="col">WHO USES IT</text>
  <text x="260" y="128" class="col">APPS</text>
  <text x="790" y="128" class="col">SCAN ENGINE</text>
  <text x="1090" y="128" class="col">WHAT IT READS</text>

  <!-- Users -->
  <rect x="40" y="150" width="170" height="80" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5" />
  <text x="58" y="184" class="name">Browser</text>
  <text x="58" y="206" class="detail">A person on the site</text>

  <rect x="40" y="420" width="170" height="80" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5" />
  <text x="58" y="454" class="name">Terminal or CI</text>
  <text x="58" y="476" class="detail">A developer or GitHub</text>

  <!-- Website -->
  <rect x="260" y="150" width="200" height="80" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" />
  <text x="278" y="182" class="name">Website</text>
  <text x="278" y="202" class="detail">Next.js and shadcn</text>
  <text x="278" y="219" class="mono">apps/web</text>

  <!-- API -->
  <rect x="510" y="150" width="210" height="80" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" />
  <text x="528" y="182" class="name">API server</text>
  <text x="528" y="202" class="detail">Express, runs scan jobs</text>
  <text x="528" y="219" class="mono">apps/api</text>

  <!-- Database -->
  <rect x="510" y="290" width="210" height="80" rx="10" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5" />
  <text x="528" y="322" class="name">Database</text>
  <text x="528" y="342" class="detail">Scan history, verified domains</text>
  <text x="528" y="359" class="mono">SQLite</text>

  <!-- CLI -->
  <rect x="260" y="420" width="200" height="80" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" />
  <text x="278" y="452" class="name">CLI</text>
  <text x="278" y="472" class="detail">npx siteshield scan</text>
  <text x="278" y="489" class="mono">packages/cli</text>

  <!-- Engine container -->
  <rect x="770" y="140" width="270" height="380" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5" />
  <text x="790" y="508" class="mono">packages/core</text>

  <!-- Engine steps -->
  <rect x="790" y="160" width="230" height="64" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" />
  <circle cx="812" cy="192" r="11" fill="#4285f4" />
  <text x="812" y="196.5" class="num" text-anchor="middle">1</text>
  <text x="832" y="187" class="name">Live scan</text>
  <text x="832" y="206" class="detail">TLS, headers, DNS, exposure</text>

  <rect x="790" y="244" width="230" height="64" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5" />
  <circle cx="812" cy="276" r="11" fill="#34a853" />
  <text x="812" y="280.5" class="num" text-anchor="middle">2</text>
  <text x="832" y="271" class="name">Code scan</text>
  <text x="832" y="290" class="detail">Secrets, routes, packages</text>

  <rect x="790" y="328" width="230" height="64" rx="8" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5" />
  <circle cx="812" cy="360" r="11" fill="#f9ab00" />
  <text x="812" y="364.5" class="num" text-anchor="middle">3</text>
  <text x="832" y="355" class="name">Match findings</text>
  <text x="832" y="374" class="detail">Found in both = confirmed</text>

  <rect x="790" y="412" width="230" height="64" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5" />
  <circle cx="812" cy="444" r="11" fill="#ea4335" />
  <text x="812" y="448.5" class="num" text-anchor="middle">4</text>
  <text x="832" y="439" class="name">Grade and fixes</text>
  <text x="832" y="458" class="detail">A to F, code for your stack</text>

  <!-- Step flow -->
  <path class="line" d="M905 224 V244" marker-end="url(#arrow)" />
  <path class="line" d="M905 308 V328" marker-end="url(#arrow)" />
  <path class="line" d="M905 392 V412" marker-end="url(#arrow)" />

  <!-- Things it reads (outside the project, dashed) -->
  <rect x="1090" y="162" width="170" height="60" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1106" y="188" class="name">Your live site</text>
  <text x="1106" y="207" class="detail">yoursite.com</text>

  <rect x="1090" y="246" width="170" height="60" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1106" y="272" class="name">Your source code</text>
  <text x="1106" y="291" class="detail">Folder or GitHub repo</text>

  <rect x="1090" y="330" width="170" height="60" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1106" y="356" class="name">OSV.dev</text>
  <text x="1106" y="375" class="detail">Known package flaws</text>

  <!-- Arrows: users to apps -->
  <path class="line" d="M210 190 H258" marker-end="url(#arrow)" />
  <path class="line" d="M210 460 H258" marker-end="url(#arrow)" />
  <!-- Website to API -->
  <path class="line" d="M460 190 H508" marker-end="url(#arrow)" />
  <!-- API to database -->
  <path class="line" d="M615 230 V288" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <!-- API to engine -->
  <path class="line" d="M720 190 H768" marker-end="url(#arrow)" />
  <!-- CLI to engine -->
  <path class="line" d="M460 460 H768" marker-end="url(#arrow)" />
  <!-- Engine to outside -->
  <path class="line" d="M1020 192 H1088" marker-end="url(#arrow)" />
  <path class="line" d="M1020 276 H1088" marker-end="url(#arrow)" />
  <path class="line" d="M1020 292 H1050 V360 H1088" marker-end="url(#arrow)" />

  <!-- Footer notes -->
  <line x1="40" y1="552" x2="1250" y2="552" stroke="#dadce0" stroke-width="1" />
  <text x="40" y="584" class="detail">The website and the CLI share the same engine, so a scan gives the same report either way.</text>
  <text x="40" y="606" class="detail">Dashed boxes are outside the project. Active live checks run only after domain ownership is verified.</text>
</svg>
